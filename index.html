<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tgs JS 1 Calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-slate-100 p-5 font-sans">
    <script src="script.js"></script>

    <div class="w-full max-w-[360px] bg-white p-6 rounded-2xl border border-gray-200 shadow-lg">

        <div class="mb-8">
            <h2 class="text-xl font-bold text-gray-800">
                Tgs 1 JavaScript
            </h2>
        </div>

        <div class="min-h-[110px] flex justify-end items-end mb-6 px-1 py-4 border-b border-gray-100 overflow-hidden">
            <div 
                class="text-[46px] font-semibold text-gray-800 overflow-hidden text-ellipsis whitespace-nowrap"
                id="result">
                0
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2.5">

            <button onclick="acDisplay()"
                class="h-[62px] rounded-xl bg-blue-50 text-blue-600 font-semibold text-lg hover:bg-blue-100 active:scale-95 transition">
                AC
            </button>

            <button onclick="dellDisplay()"
                class="h-[62px] rounded-xl bg-blue-50 text-blue-600 font-semibold text-lg hover:bg-blue-100 active:scale-95 transition">
                DEL
            </button>

            <button onclick="percentage()"
                class="h-[62px] rounded-xl bg-blue-50 text-blue-600 font-semibold text-lg hover:bg-blue-100 active:scale-95 transition">
                %
            </button>

            <button onclick="Operator('/')"
                class="h-[62px] rounded-xl bg-blue-100 text-blue-700 font-semibold text-2xl hover:bg-blue-200 active:scale-95 transition">
                ÷
            </button>

            <button onclick="appendNumber('7')" class="h-[62px] rounded-xl bg-gray-100 text-gray-800 text-xl hover:bg-gray-200 active:scale-95 transition">7</button>
            <button onclick="appendNumber('8')" class="h-[62px] rounded-xl bg-gray-100 text-gray-800 text-xl hover:bg-gray-200 active:scale-95 transition">8</button>
            <button onclick="appendNumber('9')" class="h-[62px] rounded-xl bg-gray-100 text-gray-800 text-xl hover:bg-gray-200 active:scale-95 transition">9</button>

            <button onclick="Operator('*')"
                class="h-[62px] rounded-xl bg-blue-100 text-blue-700 text-2xl hover:bg-blue-200 active:scale-95 transition">
                ×
            </button>

            <button onclick="appendNumber('4')" class="h-[62px] rounded-xl bg-gray-100 text-gray-800 text-xl hover:bg-gray-200 active:scale-95 transition">4</button>
            <button onclick="appendNumber('5')" class="h-[62px] rounded-xl bg-gray-100 text-gray-800 text-xl hover:bg-gray-200 active:scale-95 transition">5</button>
            <button onclick="appendNumber('6')" class="h-[62px] rounded-xl bg-gray-100 text-gray-800 text-xl hover:bg-gray-200 active:scale-95 transition">6</button>

            <button onclick="Operator('-')"
                class="h-[62px] rounded-xl bg-blue-100 text-blue-700 text-2xl hover:bg-blue-200 active:scale-95 transition">
                −
            </button>

            <button onclick="appendNumber('1')" class="h-[62px] rounded-xl bg-gray-100 text-gray-800 text-xl hover:bg-gray-200 active:scale-95 transition">1</button>
            <button onclick="appendNumber('2')" class="h-[62px] rounded-xl bg-gray-100 text-gray-800 text-xl hover:bg-gray-200 active:scale-95 transition">2</button>
            <button onclick="appendNumber('3')" class="h-[62px] rounded-xl bg-gray-100 text-gray-800 text-xl hover:bg-gray-200 active:scale-95 transition">3</button>

            <button onclick="Operator('+')"
                class="h-[62px] rounded-xl bg-blue-100 text-blue-700 text-2xl hover:bg-blue-200 active:scale-95 transition">
                +
            </button>

            <button onclick="appendNumber('0')"
                class="col-span-2 h-[62px] rounded-xl bg-gray-100 text-gray-800 text-xl hover:bg-gray-200 active:scale-95 transition">
                0
            </button>

            <button onclick="appendNumber('.')"
                class="h-[62px] rounded-xl bg-gray-100 text-gray-800 text-xl hover:bg-gray-200 active:scale-95 transition">
                .
            </button>

            <button onclick="calculate()"
                class="h-[62px] rounded-xl bg-blue-600 text-white text-2xl font-bold hover:bg-blue-700 active:scale-95 transition shadow-md shadow-blue-200">
                =
            </button>

        </div>

    </div>
    
</body>
</html>
